<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:fragment="head(title)"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet"><script src="https://unpkg.com/htmx.org@2.0.3"></script><script src="/js/app.js" defer></script><title th:text="${title} + ' | Lunch Pool'"></title><link rel="stylesheet" href="/css/app.css"></head><body><nav th:fragment="nav" class="nav"><b>Lunch Pool</b><a href="/">Summary</a><a href="/entry">Daily entry</a><a href="/dues">Dues</a><a href="/settings">Friends &amp; settings</a><form method="post" action="/logout"><button>Log out</button></form><script>document.querySelectorAll('.nav a').forEach(a=>{const p=location.pathname;if(a.pathname===p||(a.pathname==='/'&&p==='/summary')||(a.pathname==='/entry'&&p.startsWith('/entry'))||(a.pathname==='/'&&p.startsWith('/summary')))a.setAttribute('aria-current','page')})</script></nav><dialog th:fragment="flash" id="flash-dialog"><h2 th:text="${successMessage != null ? 'Done' : 'Unable to save'}"></h2><p th:text="${successMessage != null ? successMessage : errorMessage}"></p><div class="dialog-actions"><button type="button" class="button dark" onclick="this.closest('dialog').close()">OK</button></div><script th:if="${successMessage != null or errorMessage != null}">document.querySelector('#flash-dialog').showModal();</script></dialog></body></html>

<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:fragment="head(title)"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/htmx.org@2.0.3"></script><title th:text="${title} + ' | Lunch Pool'"></title><link rel="stylesheet" href="/css/app.css"></head><body><nav th:fragment="nav" class="nav"><b>Lunch Pool</b><a href="/">Summary</a><a href="/entry">Daily entry</a><a href="/dues">Dues</a><a href="/settings">Friends & settings</a><form method="post" action="/logout"><button>Log out</button></form></nav><dialog th:fragment="flash" id="flash-dialog"><h2 th:text="${successMessage != null ? 'Success' : 'Unable to save'}"></h2><p th:text="${successMessage != null ? successMessage : errorMessage}"></p><button type="button" class="button dark" onclick="this.closest('dialog').close()">OK</button><script th:if="${successMessage != null or errorMessage != null}">document.querySelector('#flash-dialog').showModal();</script></dialog></body></html>

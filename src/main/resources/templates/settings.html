<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Friends & Settings')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div th:replace="~{fragments :: flash}"></div>
<main class="wrap">
	<h1>Friends &amp; settings</h1>
	<form method="post" action="/settings/friend" class="panel">
		<input type="hidden" name="_csrf" th:value="${_csrf.token}">
		<h2>Add a friend</h2>
		<label>Name<input name="name" required placeholder="Name"></label>
		<button class="button dark">Add friend</button>
	</form>
	<div class="panel">
		<h2>Manage friends</h2>
		<form th:each="f : ${friends}" method="post" th:action="@{/settings/friend/{id}(id=${f.id})}" class="manage">
			<input type="hidden" name="_csrf" th:value="${_csrf.token}">
			<label class="nm">Name<input name="name" th:value="${f.name}"></label>
			<label class="tog"><input type="checkbox" name="active" value="true" th:checked="${f.active}"><span class="pill"><span class="on">Active</span><span class="off">Inactive</span></span></label>
			<button class="button">Save</button>
		</form>
	</div>
</main>
</body>
</html>

<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>Lunch Pool</title></head><body class="bg-amber-50 min-h-screen grid place-items-center p-6"><form method="post" class="bg-white p-7 rounded-xl shadow max-w-sm w-full space-y-4"><input type="hidden" name="_csrf" th:value="${_csrf.token}"><h1 class="text-3xl font-black text-slate-900">Lunch Pool</h1><p class="text-slate-500">One shared password for the group.</p><input name="username" value="group" type="hidden"><input name="password" type="password" required autofocus placeholder="Group password" class="w-full border rounded-lg p-3"><button class="w-full bg-slate-900 text-white rounded-lg p-3 font-bold">Sign in</button><p th:if="${param.error}" class="text-red-600">That password did not work.</p></form></body></html>
